# Korean navigation.
#
# Same structure, weights and URLs as menus.toml -- the theme runs every menu
# URL through relLangURL, so these relative paths pick up the /ko/ prefix on
# their own and must NOT be written with it. Only `name` is translated.
#
# Keep this file in step with menus.toml: scripts/sync_korean.py checks that the
# two have the same identifiers and weights and reports any that drift.

